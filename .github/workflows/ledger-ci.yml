name: ledger-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, deliberately. Two checks need more than the tip:
          # the state-transition range walks every edge in the push, and the
          # closure check decides whether a cited commit is REACHABLE. A
          # shallow clone makes live commits look dangling, so the closure
          # check refuses to run in one rather than report a false failure.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: resolve the range this push or PR actually covers
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="$(git merge-base "${{ github.event.pull_request.base.sha }}" HEAD)"
          else
            BASE="${{ github.event.before }}"
          fi
          echo "DOCKET_BASE=$BASE"          >> "$GITHUB_ENV"
          echo "DOCKET_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "range: $BASE..$(git rev-parse HEAD)"

      # Each check is its own step and its own exit code. No &&-chains, no
      # pipes: a chain launders the first verdict behind the last command's.

      - name: duplicate ids
        run: python checks/check_duplicate_ids.py DOCKET.md

      - name: phantom ids
        # Teaching surfaces (README, protocol, diagram, templates, examples,
        # tests) cite SYNTHETIC ids by necessity and are allowlisted
        # consciously. DOCKET.md (the arg) and CHANGELOG.md are allowed by the
        # check's own default. Everything else stays guarded.
        # ADOPTERS: this --allow list is THIS repo's layout -- when you copy
        # this workflow, replace it with your own teaching/doc paths (or drop
        # it entirely if your docs only cite real rows).
        run: >
          python checks/check_phantom_ids.py DOCKET.md
          --allow README.md PROTOCOL.md diagram.svg templates/ examples/ tests/

      - name: merge driver is not union
        run: python checks/check_merge_driver.py DOCKET.md

      - name: pending markers (informational listing)
        run: python checks/check_pending_markers.py DOCKET.md

      - name: closure references resolve and are reachable
        run: python checks/check_closure_references.py DOCKET.md

      - name: state transitions across EVERY edge in the range
        # Not HEAD~1..HEAD. A silent reopen in the middle of a multi-commit
        # push is invisible to an endpoint comparison; this walks every
        # parent->child edge in the range, merges included.
        run: >
          python checks/check_state_transitions_range.py
          --base "$DOCKET_BASE" --head "$DOCKET_HEAD"

      - name: commits cite the rows they advance
        run: >
          python checks/check_commit_ids.py
          --base "$DOCKET_BASE" --head "$DOCKET_HEAD"

      - name: fixture suite (every check RED on its failing case, GREEN on its passing case)
        run: |
          python -m pip -q install pytest
          python -m pytest tests/test_checks.py -q
